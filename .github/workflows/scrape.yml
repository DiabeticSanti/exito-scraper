name: Scrape diario

on:
  schedule:
    - cron: "0 13 * * *"     # 08:00 hora de Colombia (UTC-5)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt && pip install -e .
      - name: Medir precio y disponibilidad
        run: python -m exito_scraper --metodo requests --salida data/historico.csv
      - name: Guardar la nueva fila en el repositorio
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/historico.csv
          git diff --cached --quiet || git commit -m "data: nueva medición $(date -u +%F)"
          git push
