name: CI

on:
  push:
    branches: [develop, "feature/**", "fix/**", "docs/**"]
  pull_request:
    branches: [develop, main]
  workflow_call:        # permite que cd.yml reutilice este mismo pipeline

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check .

  test:
    name: Pruebas (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt && pip install -e .
      - name: pytest con cobertura (mínimo 85 %)
        run: pytest --cov=exito_scraper --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - name: Subir reporte de cobertura
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
