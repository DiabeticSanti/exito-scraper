[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exito-scraper"
version = "0.1.0"
description = "Monitor de precio y disponibilidad de un producto de Éxito (web scraping + CI/CD)"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "beautifulsoup4>=4.12"]

[project.optional-dependencies]
selenium = ["selenium>=4.20"]
scrapy = ["scrapy>=2.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["live: prueba que usa la red (no se ejecuta en CI normal)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
